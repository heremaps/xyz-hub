# This module reuses the xyz-util test-jar, which ships its own junit-platform.properties
# enabling parallel test execution. Without an explicit configuration here, that file would be
# picked up from the classpath and would silently switch all tests of this module to parallel
# execution. The tests here were never written with that in mind, so keep the previous
# (sequential) behavior explicitly.
junit.jupiter.execution.parallel.enabled = false
